[package]
name = "disk-vacuum"
version = "0.1.20"
description = "A fast, visual cross-platform storage cleaner and disk analyzer."
authors = ["Khalid Khan (@khalids01)"]
homepage = "https://diskvacuum.skycanvasstudio.com/"
repository = "https://github.com/khalids01/disk-vacuum"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "disk_vacuum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sysinfo = "0.38.4"
tauri-plugin-dialog = "2.7.3"
rayon = "1.12.0"
libc = "0.2.189"
blake3 = "1.8.7"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2.7"

[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
