name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "CNAME"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site artifact
        run: |
          test -f website/index.html
          test -f website/CNAME
          test "$(cat website/CNAME)" = "diskvacuum.skycanvasstudio.com"
          if grep -q '/src/main.tsx' website/index.html; then
            echo "Refusing to deploy the Vite development entry."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
