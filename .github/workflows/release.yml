name: Release DiskVacuum
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
          - platform: macos-15
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Verify release tag matches the app version
        run: bun run version:check
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DiskVacuum ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  finalize:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Build combined updater manifest and publish
        uses: actions/github-script@v8
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release) throw new Error("Draft release not found for " + tag);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            const find = (suffix) => {
              const asset = assets.find((candidate) => candidate.name.endsWith(suffix));
              if (!asset) throw new Error("Missing release asset ending in " + suffix);
              return asset;
            };
            const signature = async (artifact) => {
              const sig = find(artifact.name + ".sig");
              const response = await fetch(sig.url, {
                headers: {
                  accept: "application/octet-stream",
                  authorization: `Bearer ${process.env.RELEASE_TOKEN}`,
                  "x-github-api-version": "2022-11-28",
                },
              });
              if (!response.ok) throw new Error(`Could not download ${sig.name}: ${response.status} ${await response.text()}`);
              return (await response.text()).trim();
            };
            const entry = async (suffix) => {
              const artifact = find(suffix);
              const encodedName = artifact.name.split("/").map(encodeURIComponent).join("/");
              const url = `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodedName}`;
              return { signature: await signature(artifact), url };
            };
            const linuxAppImage = await entry("_amd64.AppImage");
            const linuxDeb = await entry("_amd64.deb");
            const linuxRpm = await entry(".x86_64.rpm");
            const windowsNsis = await entry("_x64-setup.exe");
            const windowsMsi = await entry("_x64_en-US.msi");
            const macArm = await entry("_aarch64.app.tar.gz");
            const macIntel = await entry("_x64.app.tar.gz");
            const manifest = {
              version,
              notes: release.body || "DiskVacuum " + tag,
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": linuxAppImage,
                "linux-x86_64-appimage": linuxAppImage,
                "linux-x86_64-deb": linuxDeb,
                "linux-x86_64-rpm": linuxRpm,
                "windows-x86_64": windowsNsis,
                "windows-x86_64-nsis": windowsNsis,
                "windows-x86_64-msi": windowsMsi,
                "darwin-aarch64": macArm,
                "darwin-aarch64-app": macArm,
                "darwin-x86_64": macIntel,
                "darwin-x86_64-app": macIntel,
              },
            };
            const existing = assets.find((asset) => asset.name === "latest.json");
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            const data = Buffer.from(JSON.stringify(manifest, null, 2));
            const upload = await fetch(`https://uploads.github.com/repos/${owner}/${repo}/releases/${release.id}/assets?name=latest.json`, {
              method: "POST",
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.RELEASE_TOKEN}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
              },
              body: data,
            });
            if (!upload.ok) throw new Error(`Could not upload latest.json: ${upload.status} ${await upload.text()}`);
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
