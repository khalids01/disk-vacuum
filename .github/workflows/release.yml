name: Release DiskVacuum
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
          - platform: macos-15
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Verify release tag matches the app version
        run: bun run version:check
      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DiskVacuum ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  finalize:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Build combined updater manifest and publish
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            const find = (suffix) => {
              const asset = assets.find((candidate) => candidate.name.endsWith(suffix));
              if (!asset) throw new Error("Missing release asset ending in " + suffix);
              return asset;
            };
            const signature = async (artifact) => {
              const sig = find(artifact.name + ".sig");
              const response = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner, repo, asset_id: sig.id,
                headers: { accept: "application/octet-stream" },
              });
              return Buffer.from(response.data).toString("utf8").trim();
            };
            const entry = async (suffix) => {
              const artifact = find(suffix);
              return { signature: await signature(artifact), url: artifact.browser_download_url };
            };
            const linuxAppImage = await entry("_amd64.AppImage");
            const linuxDeb = await entry("_amd64.deb");
            const windowsNsis = await entry("_x64-setup.exe");
            const windowsMsi = await entry("_x64_en-US.msi");
            const macArm = await entry("_aarch64.app.tar.gz");
            const macIntel = await entry("_x64.app.tar.gz");
            const manifest = {
              version,
              notes: release.body || "DiskVacuum " + tag,
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": linuxAppImage,
                "linux-x86_64-deb": linuxDeb,
                "windows-x86_64": windowsNsis,
                "windows-x86_64-nsis": windowsNsis,
                "windows-x86_64-msi": windowsMsi,
                "darwin-aarch64": macArm,
                "darwin-aarch64-app": macArm,
                "darwin-x86_64": macIntel,
                "darwin-x86_64-app": macIntel,
              },
            };
            const existing = assets.find((asset) => asset.name === "latest.json");
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            const data = Buffer.from(JSON.stringify(manifest, null, 2));
            await github.request("POST /repos/{owner}/{repo}/releases/{release_id}/assets", {
              owner, repo, release_id: release.id, name: "latest.json", data,
              headers: { "content-type": "application/json", "content-length": data.length },
            });
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
